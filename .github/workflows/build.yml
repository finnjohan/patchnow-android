name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.PATCHNOW_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Ingen gradle-wrapper i repot: Gradle installeras här
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Logiktester
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Bygg testversion (debug)
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/patchnow-$VERSION-debug.apk"

      - name: Bygg utgåva (om signeringsnyckeln finns)
        if: env.HAS_KEY == 'true'
        env:
          PATCHNOW_KEYSTORE_PASSWORD: ${{ secrets.PATCHNOW_KEYSTORE_PASSWORD }}
          PATCHNOW_KEY_ALIAS: ${{ secrets.PATCHNOW_KEY_ALIAS }}
          PATCHNOW_KEY_PASSWORD: ${{ secrets.PATCHNOW_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.PATCHNOW_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export PATCHNOW_KEYSTORE="$RUNNER_TEMP/release.keystore"
          gradle --no-daemon --stacktrace :app:assembleRelease
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "out/patchnow-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: patchnow-apk
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/

      # En tagg som v1.0.0 ger en utgåva under Releases
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: out/*.apk

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: patchnow-apk
          path: apk

      - name: Slå på KVM för emulatorn
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Skärmdumpar och notis i emulatorn
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
